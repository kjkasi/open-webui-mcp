[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-webui-mcp"
version = "0.1.0"
description = "Read-only MCP semantic search server for Open WebUI knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "kjkasi" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.8,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
open-webui-mcp = "open_webui_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_webui_mcp"]
force-include = { "src/open_webui_mcp/py.typed" = "open_webui_mcp/py.typed" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["open_webui_mcp"]
